id: swahili-exp41-ctc-onnx-fp32
framework: onnxruntime
adapter: ctc
artifact: swahili-exp41-ctc/model.onnx
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 1
  audio_preparation: shared_soundfile_librosa_16khz
  inference:
    artifact: project_export
    frontend: compatible_onnx_asr_nemo_frontend
    runtime: onnxruntime_shared_image
    chunking: none
  evaluation: direct_pred_text_by_output_units
  runtime_resolution: observed_effective_values_v1

loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto

decoding:
  strategy: greedy
  generation_kwargs: {}

parameter_evidence:
  - applies_to:
      - decoding.strategy
      - loader.torch_dtype
    level: exact
    source: artifact:swahili-exp41-ctc/model.onnx
    rationale: The exported FP32 graph contains CTC logits and is decoded greedily as the desktop deployment baseline.
  - applies_to:
      - artifact
    level: project
    source: repo:inference/onnxruntime/README.md
    rationale: This artifact is the matched desktop FP32 control for the quantized ONNX comparison.
