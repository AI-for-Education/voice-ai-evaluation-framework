      - decoding.strategy
      - loader.torch_dtype
    level: exact
    source: artifact:swahili-exp41-ctc/model.int8.onnx
    rationale: The exported INT8 graph contains CTC logits and is decoded greedily with the same desktop frontend as FP32.
  - applies_to:
      - artifact
    level: project
    source: repo:docs/inference-runtime-parameter-provenance.md
    rationale: This artifact is the matched desktop INT8 comparison and is not presented as an Android runtime proxy.
