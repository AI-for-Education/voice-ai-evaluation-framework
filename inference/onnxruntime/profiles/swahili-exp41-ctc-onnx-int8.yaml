profile_schema_version: 2
inference_setup_id: swahili-exp41-ctc-onnx-int8
inference_library: onnxruntime
adapter: ctc
artifact: swahili-exp41-ctc/model.int8.onnx
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 2
  audio_preparation: shared_soundfile_librosa_16khz
  model_artifact: project_export
  input_processing: compatible_onnx_asr_nemo_frontend
  execution_stack: onnxruntime_shared_image
  chunking: none
  evaluation: direct_pred_text_by_output_units
  observation_policy: observed_effective_values_v2

loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto

decoding:
  strategy: greedy
  generation_kwargs: {}

parameter_evidence:
  - applies_to:
      - decoding.strategy
      - loader.torch_dtype
    level: exact
    source: artifact:swahili-exp41-ctc/model.int8.onnx
    rationale: The exported INT8 graph contains CTC logits and is decoded greedily with the same desktop frontend as FP32.
  - applies_to:
      - artifact
    level: project
    source: repo:inference/onnxruntime/README.md
    rationale: This artifact is the matched desktop INT8 comparison and is not presented as an Android-behaviour proxy.
