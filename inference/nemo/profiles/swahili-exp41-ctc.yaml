profile_schema_version: 2
inference_setup_id: swahili-exp41-ctc
inference_library: nemo
adapter: nemo
artifact: model_exp41_avg.nemo
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 2
  audio_preparation: shared_soundfile_librosa_16khz
  model_artifact: canonical_checkpoint
  input_processing: canonical_nemo_model_preprocessor
  execution_stack: nemo_image
  chunking: none
  evaluation: direct_pred_text_by_output_units
  observation_policy: observed_effective_values_v2

loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto

decoding:
  strategy: ctc
  generation_kwargs: {}

parameter_evidence:
  - applies_to:
      - decoding.strategy
    level: exact
    source: artifact:model_exp41_avg.nemo/model_config.yaml
    rationale: The packaged NeMo configuration identifies the trained decoder as CTC.
  - applies_to:
      - loader.torch_dtype
    level: supported
    source: https://docs.nvidia.com/nemo-framework/user-guide/latest/nemotoolkit/asr/results.html
    rationale: Automatic checkpoint loading preserves the native NeMo model precision; runtime batch controls remain launcher arguments.
