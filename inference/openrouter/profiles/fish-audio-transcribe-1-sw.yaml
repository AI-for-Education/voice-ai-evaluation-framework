  strategy: transcribe
parameter_evidence:
  - applies_to: [model.slug, api.endpoint_kind]
    level: exact
    source: https://openrouter.ai/fish-audio/transcribe-1
    rationale: The exact model is a dedicated speech-to-text route with automatic language detection.
  - applies_to: [language, request.temperature, decoding.strategy]
    level: supported
    source: https://openrouter.ai/docs/guides/overview/multimodal/stt
    rationale: The STT API supports an ISO-639-1 language hint and a deterministic zero temperature.
  - applies_to:
      - api.base_url
      - api.routing_region
      - api.api_key_environment_variable
      - request.stream
      - request.provider.zdr
      - request.provider.data_collection
    level: exact
    source: https://openrouter.ai/docs/guides/features/zdr
    rationale: Repository policy selects the global gateway while keeping inherited credentials, non-streaming requests, ZDR, and denied data collection mandatory.
