id: paza-phi4-multimodal-sw
framework: multimodal
adapter: phi4_audio
artifact: paza-Phi-4-multimodal-instruct
language: sw
task: transcribe
output_units: orthographic
prompt: >-
  Transcribe the audio to Swahili.
loader:
  processor_mode: auto
  local_files_only: true
  # This exception executes only Python files bundled in the pinned local snapshot.
  trust_remote_code: true
  torch_dtype: bfloat16
  attention_implementation: sdpa
decoding:
  strategy: generate
  generation_kwargs:
    max_new_tokens: 64
audio:
  maximum_seconds: 40
  long_audio_strategy: sequential_chunks
  chunk_seconds: 40
  overlap_seconds: 0
hardware:
  memory_strategy: cpu_disk_offload
  minimum_gpu_memory_gib: 12
  gpu_max_memory_gib: 13
  cpu_max_memory_gib: 12
  output_mode: text_only

parameter_evidence:
  - applies_to:
      - prompt
      - decoding.strategy
      - decoding.generation_kwargs.max_new_tokens
      - audio.maximum_seconds
      - audio.chunk_seconds
      - loader.trust_remote_code
    level: exact
    source: https://huggingface.co/microsoft/paza-Phi-4-multimodal-instruct
    rationale: The model card provides the Swahili ASR prompt, 64-token generation example, 40-second audio recommendation, and trusted-code loader.
  - applies_to:
      - loader.torch_dtype
      - loader.attention_implementation
    level: project
    source: https://huggingface.co/microsoft/paza-Phi-4-multimodal-instruct
    rationale: BF16 plus SDPA is the current-host compatibility choice; upstream demonstrates dtype auto with Flash Attention 2 or eager attention.
  - applies_to:
      - audio.long_audio_strategy
      - audio.overlap_seconds
      - hardware.memory_strategy
      - hardware.minimum_gpu_memory_gib
      - hardware.gpu_max_memory_gib
      - hardware.cpu_max_memory_gib
      - hardware.output_mode
    level: project
    source: repo:inference/multimodal/README.md
    rationale: Chunk stitching, offload limits, and text-only execution are local deployment controls measured for the 16 GiB host.
