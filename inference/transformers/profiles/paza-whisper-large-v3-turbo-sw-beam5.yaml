# Source and decoder basis:
# https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
# The Microsoft model card publishes num_beams=5, early_stopping=true, and
# length_penalty=0.8 for its beam-decoding example.
# Caller-managed segmentation is unchanged; every input WAV must be <=30 seconds.
id: paza-whisper-large-v3-turbo-sw-beam5
framework: transformers
adapter: speech_seq2seq
artifact: paza-whisper-large-v3-turbo
language: sw
task: transcribe
output_units: orthographic
loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: generate
  generation_kwargs:
    do_sample: false
    num_beams: 5
    early_stopping: true
    length_penalty: 0.8
    return_timestamps: false
    suppress_tokens: []
  hallucination_guard:
    max_words_per_second: 8.0
    repeated_phrase_min_words: 5
    repeated_phrase_max_words: 8
    repeated_phrase_repetitions: 3

parameter_evidence:
  - applies_to:
      - decoding.generation_kwargs.num_beams
      - decoding.generation_kwargs.early_stopping
      - decoding.generation_kwargs.length_penalty
      - decoding.generation_kwargs.do_sample
      - decoding.strategy
    level: supported
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
    rationale: The model card publishes beam five, early stopping, and length penalty 0.8; this profile applies that stated decoder intent to generation.
  - applies_to:
      - decoding.generation_kwargs.suppress_tokens
      - decoding.generation_kwargs.return_timestamps
    level: exact
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo/blob/main/generation_config.json
    rationale: The packaged generation configuration sets an empty suppression list and disables timestamp output.
  - applies_to:
      - decoding.hallucination_guard.max_words_per_second
      - decoding.hallucination_guard.repeated_phrase_min_words
      - decoding.hallucination_guard.repeated_phrase_max_words
      - decoding.hallucination_guard.repeated_phrase_repetitions
    level: unvalidated
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
    rationale: The owner supports duration and repetition guards but requires per-language validation; the local 8 WPS and three-repeat thresholds are not calibrated.
