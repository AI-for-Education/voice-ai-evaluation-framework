# Source: https://huggingface.co/badrex/w2v-bert-2.0-swahili-asr
profile_schema_version: 2
inference_setup_id: w2v-bert-2.0-swahili-asr
inference_library: transformers
adapter: ctc
artifact: w2v-bert-2.0-swahili-asr
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 2
  audio_preparation: shared_soundfile_librosa_16khz
  model_artifact: canonical_checkpoint
  input_processing: canonical_transformers_auto_processor
  execution_stack: shared_transformers_image
  chunking: none
  evaluation: direct_pred_text_by_output_units
  observation_policy: observed_effective_values_v2
loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: greedy
  generation_kwargs: {}

parameter_evidence:
