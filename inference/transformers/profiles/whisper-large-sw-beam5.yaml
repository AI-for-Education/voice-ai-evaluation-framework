# Source: https://huggingface.co/openai/whisper-large
# Decoder basis: https://github.com/openai/whisper/blob/main/whisper/transcribe.py
# OpenAI's temperature-0 CLI default is beam_size=5. Transformers maps the
# equivalent deterministic mode to do_sample=false with num_beams>1:
# https://huggingface.co/docs/transformers/main_classes/text_generation
id: whisper-large-sw-beam5
framework: transformers
adapter: speech_seq2seq
artifact: whisper-large
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 1
  audio_preparation: shared_soundfile_librosa_16khz
  inference:
    artifact: canonical_checkpoint
    frontend: canonical_transformers_auto_processor
    runtime: shared_transformers_image
    chunking: whisper_timestamp_long_form
  evaluation: direct_pred_text_by_output_units
  runtime_resolution: observed_effective_values_v1
loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: generate
  generation_kwargs:
    do_sample: false
    num_beams: 5
    return_timestamps: false
  long_form:
    strategy: timestamp
    threshold_seconds: 30.0
  # pred_text is the direct model hypothesis; no text postprocessing is applied.

parameter_evidence:
  - applies_to:
      - decoding.generation_kwargs.do_sample
      - decoding.strategy
      - decoding.generation_kwargs.num_beams
    level: exact
    source: https://github.com/openai/whisper/blob/main/whisper/transcribe.py
    rationale: OpenAI's temperature-zero transcription path defaults to beam size five; Transformers expresses deterministic beam search with sampling disabled.
  - applies_to:
      - decoding.generation_kwargs.return_timestamps
      - decoding.long_form.strategy
      - decoding.long_form.threshold_seconds
    level: exact
    source: https://huggingface.co/docs/transformers/model_doc/whisper
    rationale: Transformers requires timestamp-based long-form generation for audio longer than 30 seconds; the adapter enables it only above this threshold.
  # The evaluation uses the direct model hypothesis without a post-decoding guard.
