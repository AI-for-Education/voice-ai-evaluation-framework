# Source: https://huggingface.co/openai/whisper-large-v2
id: whisper-large-v2-sw
framework: transformers
adapter: speech_seq2seq
artifact: whisper-large-v2
language: sw
task: transcribe
output_units: orthographic
loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: generate
  generation_kwargs:
    do_sample: false
    num_beams: 1
    return_timestamps: false
  long_form:
    strategy: timestamp
    threshold_seconds: 30.0
  hallucination_guard:
    max_words_per_second: 8.0
    repeated_phrase_min_words: 5
    repeated_phrase_max_words: 8
    repeated_phrase_repetitions: 3

parameter_evidence:
  - applies_to:
      - decoding.generation_kwargs.do_sample
      - decoding.strategy
      - decoding.generation_kwargs.num_beams
    level: supported
    source: https://huggingface.co/docs/transformers/main/generation_strategies
    rationale: Deterministic greedy generation is the Transformers baseline and remains separate from the beam-five profile.
  - applies_to:
      - decoding.generation_kwargs.return_timestamps
      - decoding.long_form.strategy
      - decoding.long_form.threshold_seconds
    level: exact
    source: https://huggingface.co/docs/transformers/model_doc/whisper
    rationale: Transformers requires timestamp-based long-form generation for audio longer than 30 seconds; the adapter enables it only above this threshold.
  - applies_to:
      - decoding.hallucination_guard.max_words_per_second
      - decoding.hallucination_guard.repeated_phrase_min_words
      - decoding.hallucination_guard.repeated_phrase_max_words
      - decoding.hallucination_guard.repeated_phrase_repetitions
    level: unvalidated
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
    rationale: This guard is extrapolated from Paza and its exact Swahili thresholds have not been calibrated for OpenAI Whisper.
