# Source: https://huggingface.co/bookbot/wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm
id: bookbot-orthographic-ctc
framework: transformers
adapter: ctc
artifact: wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 1
  audio_preparation: shared_soundfile_librosa_16khz
  inference:
    artifact: canonical_checkpoint
    frontend: canonical_transformers_auto_processor
    runtime: shared_transformers_image
    chunking: none
  evaluation: direct_pred_text_by_output_units
  runtime_resolution: observed_effective_values_v1
loader:
  processor_mode: wav2vec2_plain
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: greedy
  generation_kwargs: {}

parameter_evidence:
  - applies_to:
      - loader.processor_mode
      - decoding.strategy
    level: project
    source: https://huggingface.co/bookbot/wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm
    rationale: Plain-processor greedy CTC intentionally bypasses the packaged KenLM to provide a separately named acoustic-model baseline.
