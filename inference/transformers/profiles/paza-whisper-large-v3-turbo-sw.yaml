# Source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
# The owner requires segmentation above its 448-token input limit but gives no
# duration. This project uses deterministic 30-second, zero-overlap chunks in
# memory and keeps the owner's timestamp-disabled decoding configuration.
id: paza-whisper-large-v3-turbo-sw
framework: transformers
adapter: speech_seq2seq
artifact: paza-whisper-large-v3-turbo
language: sw
task: transcribe
output_units: orthographic
loader:
  processor_mode: auto
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: generate
  generation_kwargs:
    do_sample: false
    num_beams: 1
    return_timestamps: false
    suppress_tokens: []
  hallucination_guard:
    max_words_per_second: 8.0
    repeated_phrase_min_words: 5
    repeated_phrase_max_words: 8
    repeated_phrase_repetitions: 3
audio:
  maximum_seconds: 30
  long_audio_strategy: sequential_chunks
  chunk_seconds: 30
  overlap_seconds: 0

parameter_evidence:
  - applies_to:
      - decoding.generation_kwargs.suppress_tokens
      - decoding.generation_kwargs.return_timestamps
    level: exact
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo/blob/main/generation_config.json
    rationale: The packaged generation configuration sets an empty suppression list and disables timestamp output.
  - applies_to:
      - decoding.generation_kwargs.do_sample
      - decoding.strategy
      - decoding.generation_kwargs.num_beams
    level: supported
    source: https://huggingface.co/docs/transformers/main/generation_strategies
    rationale: Deterministic greedy generation is the Transformers baseline retained as a separate profile from beam search.
  - applies_to:
      - decoding.hallucination_guard.max_words_per_second
      - decoding.hallucination_guard.repeated_phrase_min_words
      - decoding.hallucination_guard.repeated_phrase_max_words
      - decoding.hallucination_guard.repeated_phrase_repetitions
    level: unvalidated
    source: https://huggingface.co/microsoft/paza-whisper-large-v3-turbo
    rationale: The owner supports duration and repetition guards but requires per-language validation; the local 8 WPS and three-repeat thresholds are not calibrated.
  - applies_to:
      - audio.maximum_seconds
      - audio.long_audio_strategy
      - audio.chunk_seconds
      - audio.overlap_seconds
    level: project
    source: repo:inference/transformers/README.md
    rationale: >-
      The owner requires segmentation above 448 input tokens but publishes no
      duration; 30-second zero-overlap chunks are the local reproducible policy.
