      - output_units
      - output_notation
      - output_inventory
      - decoding.strategy
    level: exact
    source: https://huggingface.co/bookbot/wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-alphabets-phonemes-bookbot
    rationale: The BookBot checkpoint and tokenizer define phoneme output, while CTC argmax provides its standard greedy baseline.
