# Source: https://huggingface.co/bookbot/wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm
# Decoder artifact basis: the source repository packages language_model/ and
# language_model/attrs.json. alpha=0.5, beta=1.5, unk_score_offset=-10.0, and
# score_boundary=true below mirror that packaged metadata exactly.
# Runtime API: https://huggingface.co/docs/transformers/model_doc/wav2vec2
# beam_width=100 and n_best=1 match the installed pyctcdecode/Transformers
# decoder defaults. decoder_workers=1 is the deterministic project resource
# choice and does not change the decoded one-best hypothesis.
profile_schema_version: 2
inference_setup_id: bookbot-orthographic-ctc-5gram
inference_library: transformers
adapter: ctc
artifact: wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm
language: sw
task: transcribe
output_units: orthographic
pipeline_contract:
  schema_version: 2
  audio_preparation: shared_soundfile_librosa_16khz
  model_artifact: canonical_checkpoint
  input_processing: canonical_transformers_auto_processor
  execution_stack: shared_transformers_image
  chunking: none
  evaluation: direct_pred_text_by_output_units
  observation_policy: observed_effective_values_v2
loader:
  processor_mode: wav2vec2_with_lm
  local_files_only: true
  trust_remote_code: false
  torch_dtype: auto
decoding:
  strategy: beam_search
  ctc_lm_kwargs:
    beam_width: 100
    alpha: 0.5
    beta: 1.5
    unk_score_offset: -10.0
    lm_score_boundary: true
    n_best: 1
    decoder_workers: 1

parameter_evidence:
  - applies_to:
      - loader.processor_mode
      - decoding.strategy
      - decoding.ctc_lm_kwargs.alpha
      - decoding.ctc_lm_kwargs.beta
      - decoding.ctc_lm_kwargs.unk_score_offset
      - decoding.ctc_lm_kwargs.lm_score_boundary
    level: exact
    source: artifact:wav2vec2-xls-r-300m-swahili-cv-fleurs-alffa-word-lm/language_model/attrs.json
    rationale: These values reproduce the KenLM decoder metadata packaged with the BookBot checkpoint.
  - applies_to:
      - decoding.ctc_lm_kwargs.beam_width
      - decoding.ctc_lm_kwargs.n_best
    level: supported
    source: repo:inference/transformers/README.md
    rationale: The explicit values match the installed pyctcdecode 0.5.0 decoder and Transformers processor defaults, preventing version-dependent default drift.
  - applies_to:
      - decoding.ctc_lm_kwargs.decoder_workers
    level: project
    source: repo:inference/transformers/README.md
    rationale: One persistent decoder worker is a deterministic bounded-resource choice; worker count does not change the one-best decoder arguments.
