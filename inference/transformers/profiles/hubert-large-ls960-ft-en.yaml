# English-only. Source: https://huggingface.co/facebook/hubert-large-ls960-ft
profile_schema_version: 2
inference_setup_id: hubert-large-ls960-ft-en
inference_library: transformers
adapter: ctc
artifact: hubert-large-ls960-ft
